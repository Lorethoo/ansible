---
- name: Configure QoS for VoIP on router
  hosts: switches
  gather_facts: no
  tasks:

    - name: Define VOICE class-map
      ios_config:
        lines:
          - match ip dscp ef
        parents: class-map match-any VOICE

    - name: Define QoS policy-map
      ios_config:
        lines:
          - class VOICE
          - priority percent 70
          - class class-default
          - fair-queue
        parents: policy-map QOS-POLICY

    - name: Apply QoS policy to interface
      ios_config:
        lines:
          - service-policy output QOS-POLICY
        parents: interface GigabitEthernet0/0

    - name: Save configuration
      ios_command:
        commands: write memory

